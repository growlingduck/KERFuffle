<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KERFuffle</title>
    <!-- Theme before first paint (src/theme.ts takes over): Light/Dark set data-theme, System leaves it off. -->
    <script>
      try {
        var t = localStorage.getItem('kerfuffle.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- The paper color until the stylesheets load: --paper in tokens.css, light and dark. Screen only: print is always light. -->
    <style>
      @media screen {
        html { background: #f2f1eb; color-scheme: light; }
        html[data-theme='dark'] { background: #0e1621; color-scheme: dark; }
      }
      @media screen and (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background: #0e1621; color-scheme: dark; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
